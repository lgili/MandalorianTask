name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }   # casar exato com packageManager da raiz
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test

  build:
    needs: check
    # Repo novo em conta pessoal nasce com GITHUB_TOKEN somente-leitura; sem isto
    # o tauri-action leva 403 ao criar o release DEPOIS de compilar os dois alvos.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows primeiro: é a máquina de trabalho.
          - os: windows-latest
            args: "--bundles nsis"
          - os: macos-latest
            args: "--bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }   # casar exato com packageManager da raiz
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Bancada ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
