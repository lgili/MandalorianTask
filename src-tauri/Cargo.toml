[package]
name = "bancada"
version = "0.1.0"
description = "Bancada — local-first work log: tasks, time and notes"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-store = "2.4.4"
# v0.3 — notes vault. `watch` reports when Obsidian (or git, or Dropbox)
# changes a .md from outside, so the index never lies.
tauri-plugin-fs = { version = "2.5.2", features = ["watch"] }
# The vault folder is picked in the system dialog, and the dialog only grants
# access while the app is open. Without this, every restart would ask for the
# folder again.
tauri-plugin-persisted-scope = "2.3.8"

# v0.2 — Google Calendar. Uncomment together with the plugins in main.rs
# and the permissions in capabilities/default.json.
# tauri-plugin-http = "2.6.0"
# tauri-plugin-oauth = "2.1.0"          # FabianLars; npm: @fabianlars/tauri-plugin-oauth
# tauri-plugin-notification = "2.4.0"   # v0.4 — due-date alerts
# tauri-plugin-global-shortcut = "2.3.2" # quick capture from anywhere

[dev-dependencies]
# Only for the migration tests: the SAME sqlx that tauri-plugin-sql uses, so
# the tests run the real migrator over the bundled SQLite.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["macros", "rt"] }
# Same SHA-384 sqlx uses for migration checksums — already in the lockfile via sqlx.
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
